[build-system]
requires = [
    "hatchling>=1.27",
    "hatch-nodejs-version>=0.3.2",
    "jupyter-builder>=1.2.0,<2",
]
build-backend = "hatchling.build"

[project]
name = "p5-notebook"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Jupyter",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyterlab>=4.6.4,<4.7",
    "notebook>=7.6.3,<7.7",
    "jupyterlab-language-pack-es-ES",
    "jupyterlab-language-pack-fr-FR",
    "jupyterlab-language-pack-it-IT",
    "jupyterlab-language-pack-pl-PL",
    "jupyterlab-language-pack-zh-CN",
    "jupyterlite-p5-kernel>=0.4.0a2,<0.5",
    "jupyterlite-core>=0.8.5,<0.9",
]
dynamic = [
    "version",
    "description",
    "authors",
    "urls",
    "keywords",
]

[tool.hatch.metadata.hooks.nodejs]
fields = [
    "description",
    "authors",
    "urls",
    "keywords",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.hooks.version]
path = "p5_notebook/_version.py"

[tool.hatch.build.targets.wheel.shared-data]
"p5_notebook/labextension/static" = "share/jupyter/labextensions/@p5-notebook/lab-extension/static"
"p5_notebook/labextension/package.json" = "share/jupyter/labextensions/@p5-notebook/lab-extension/package.json"
"packages/lab-extension/install.json" = "share/jupyter/labextensions/@p5-notebook/lab-extension/install.json"
"p5_notebook/p5-theme-light/static" = "share/jupyter/labextensions/@p5-notebook/p5-theme-light/static"
"p5_notebook/p5-theme-light/themes" = "share/jupyter/labextensions/@p5-notebook/p5-theme-light/themes"
"p5_notebook/p5-theme-light/package.json" = "share/jupyter/labextensions/@p5-notebook/p5-theme-light/package.json"
"packages/p5-theme-light/install.json" = "share/jupyter/labextensions/@p5-notebook/p5-theme-light/install.json"
"p5_notebook/p5-theme-dark/static" = "share/jupyter/labextensions/@p5-notebook/p5-theme-dark/static"
"p5_notebook/p5-theme-dark/themes" = "share/jupyter/labextensions/@p5-notebook/p5-theme-dark/themes"
"p5_notebook/p5-theme-dark/package.json" = "share/jupyter/labextensions/@p5-notebook/p5-theme-dark/package.json"
"packages/p5-theme-dark/install.json" = "share/jupyter/labextensions/@p5-notebook/p5-theme-dark/install.json"

[tool.hatch.build.targets.sdist]
artifacts = [
    "p5_notebook/labextension",
    "p5_notebook/p5-theme-light",
    "p5_notebook/p5-theme-dark",
]
exclude = [
    ".github",
]

# hatchling skips packages/ after it follows the workspace symlinks in node_modules
[tool.hatch.build.targets.sdist.force-include]
"packages/lab-extension/install.json" = "packages/lab-extension/install.json"
"packages/p5-theme-light/install.json" = "packages/p5-theme-light/install.json"
"packages/p5-theme-dark/install.json" = "packages/p5-theme-dark/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = [
    "hatch-jupyter-builder>=0.8.3",
]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "p5_notebook/labextension/package.json",
    "p5_notebook/p5-theme-light/package.json",
    "p5_notebook/p5-theme-dark/package.json",
]
skip-if-exists = [
    "p5_notebook/labextension/package.json",
    "p5_notebook/p5-theme-light/package.json",
    "p5_notebook/p5-theme-dark/package.json",
]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build"
npm = [
    "jlpm",
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = [
    "jlpm",
]
