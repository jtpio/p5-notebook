name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true

      # --no-editable builds the extensions in production mode
      - name: Install dependencies and build the extensions
        run: uv sync --locked --no-editable

      - name: Lint the extensions
        run: |
          set -eux
          jlpm install --immutable
          jlpm run lint:check

      - name: Check the extensions are installed
        run: |
          set -eux
          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "@p5-notebook/lab-extension.*OK"
          jupyter labextension list 2>&1 | grep -ie "@p5-notebook/p5-theme-light.*OK"
          jupyter labextension list 2>&1 | grep -ie "@p5-notebook/p5-theme-dark.*OK"

      - name: Package the extensions
        run: uv build

      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: extension-artifacts
          path: dist/p5_notebook*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: extension-artifacts

      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          uv pip install p5_notebook*.whl

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "@p5-notebook/lab-extension.*OK"
          jupyter labextension list 2>&1 | grep -ie "@p5-notebook/p5-theme-light.*OK"
          jupyter labextension list 2>&1 | grep -ie "@p5-notebook/p5-theme-dark.*OK"

  ui_tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install dependencies and build the extensions
        run: uv sync --locked --no-editable

      - name: Install the UI test dependencies
        working-directory: ui-tests
        run: jlpm install --immutable

      - name: Build the JupyterLite site
        working-directory: ui-tests
        run: jlpm build

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui-tests/yarn.lock') }}

      - name: Install the browser
        working-directory: ui-tests
        run: jlpm playwright install --with-deps chromium --only-shell

      - name: Run the UI tests
        working-directory: ui-tests
        run: jlpm test

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-report
          path: |
            ui-tests/playwright-report
            ui-tests/test-results

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
